buildscript {
    ext.kotlin_version = "1.9.22"
    ext.compose_version = "1.5.10"
    ext.accompanist_version = "0.34.0"

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath("com.ncorti.ktfmt.gradle:plugin:0.17.0")
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

apply plugin: 'kotlin-android'
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.ncorti.ktfmt.gradle'

android {
    def androidApiLevel = providers.gradleProperty("androidApiLevel").get().toInteger()

    ndkVersion "23.1.7779620"
    compileSdkVersion androidApiLevel
    defaultConfig {
        applicationId 'com.stardom.vpn'
        manifestPlaceholders.appAuthRedirectScheme = "com.stardom.vpn"
        minSdkVersion 26
        targetSdkVersion androidApiLevel
        // versionCode is written here by `make bumposs` / `make tag_release`
        // (base = major*100000000 + minor*100000 + patch*10). AndroidTV builds
        // increment this by 1 in the Makefile's release-tv target so the two
        // variants are distinguishable in the Play Store.
        versionCode 110102910
        versionName getVersionProperty("VERSION_LONG")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // This setting, which defaults to 'true', will cause Tailscale to fall
        // back to the Google DNS servers if it cannot determine what the
        // operating system's DNS configuration is.
        //
        // Set it to false either here or in your local.properties file to
        // disable this behaviour.
        buildConfigField "boolean", "USE_GOOGLE_DNS_FALLBACK", getLocalProperty("tailscale.useGoogleDnsFallback", "true")
        buildConfigField "String", "HEADSCALE_CONTROL_URL", stardomBuildConfigValue("stardom.headscaleControlUrl", "https://headscale.invalid")
        buildConfigField "String", "POLICY_API_BASE_URL", stardomBuildConfigValue("stardom.policyApiBaseUrl", "https://policy.invalid")
        buildConfigField "String", "AUTHENTIK_ISSUER_URL", stardomBuildConfigValue("stardom.authentikIssuerUrl", "https://auth.invalid")
        buildConfigField "String", "POLICY_API_OIDC_CLIENT_ID", stardomBuildConfigValue("stardom.policyApiOidcClientId", "stardom-debug-client")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        warningsAsErrors true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "$compose_version"
    }
    flavorDimensions "version"
    namespace 'com.tailscale.ipn'

    buildTypes {
        applicationTest {
            initWith debug
            manifestPlaceholders.leanbackRequired = isTV()
        }
        debug {
            manifestPlaceholders.leanbackRequired = isTV()
        }
        release {
            manifestPlaceholders.leanbackRequired = isTV()

            buildConfigField "String", "HEADSCALE_CONTROL_URL", stardomBuildConfigValue("stardom.headscaleControlUrl", "https://headscale.invalid")
            buildConfigField "String", "POLICY_API_BASE_URL", stardomBuildConfigValue("stardom.policyApiBaseUrl", "https://policy.invalid")
            buildConfigField "String", "AUTHENTIK_ISSUER_URL", stardomBuildConfigValue("stardom.authentikIssuerUrl", "https://auth.invalid")
            buildConfigField "String", "POLICY_API_OIDC_CLIENT_ID", stardomBuildConfigValue("stardom.policyApiOidcClientId", "stardom-debug-client")

            minifyEnabled true

            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    testBuildType "applicationTest"
}

dependencies {
    // Android dependencies.
    implementation "androidx.core:core:1.13.1"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "net.openid:appauth:0.11.1"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Kotlin dependencies.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation 'junit:junit:4.13.2'
    implementation 'androidx.room:room-ktx:2.6.1'
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    // Compose dependencies.
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.3'
    implementation 'androidx.compose.material:material-icons-extended:1.7.3'
    implementation "androidx.compose.ui:ui:1.7.3"
    implementation "androidx.compose.ui:ui-tooling:1.7.3"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation "com.google.accompanist:accompanist-permissions:$accompanist_version"
    implementation "com.google.accompanist:accompanist-systemuicontroller:$accompanist_version"
    implementation "androidx.core:core-splashscreen:1.1.0-rc01"
    implementation "androidx.compose.animation:animation:1.7.4"

    // Navigation dependencies.
    def nav_version = "2.8.5"
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Supporting libraries.
    implementation("io.coil-kt:coil-compose:2.6.0")
    implementation("com.google.zxing:core:3.5.1")
    implementation("com.patrykandpatrick.vico:compose:1.15.0")
    implementation("com.patrykandpatrick.vico:compose-m3:1.15.0")

    // Tailscale dependencies.
    implementation ':libtailscale@aar'

    // Integration Tests
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.3'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'


    // Unit Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'

    debugImplementation("androidx.compose.ui:ui-tooling")
    implementation("androidx.compose.ui:ui-tooling-preview")
}

def getLocalProperty(key, defaultValue) {
    try {
        Properties properties = new Properties()
        properties.load(project.file('local.properties').newDataInputStream())
        return properties.getProperty(key) ?: defaultValue
    } catch(Throwable ignored) {
        return defaultValue
    }
}

def stardomBuildConfigValue(key, defaultValue) {
    def value = providers.gradleProperty(key).orNull ?: defaultValue
    return quoteBuildConfigValue(value.toString().trim())
}

def quoteBuildConfigValue(value) {
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseArtifactTasks = ["assembleRelease", "bundleRelease", "packageRelease", "signReleaseBundle"]
    if (taskGraph.allTasks.any { it.name in releaseArtifactTasks }) {
        [
            "stardom.headscaleControlUrl",
            "stardom.policyApiBaseUrl",
            "stardom.authentikIssuerUrl",
        ].each { key ->
            requireReleaseHttpsUrl(key)
        }
        def clientId = providers.gradleProperty("stardom.policyApiOidcClientId").orNull?.trim()
        if (clientId == null || clientId.isEmpty()) {
            throw new GradleException(
                    "Missing required release Gradle property after trimming: stardom.policyApiOidcClientId")
        }
    }
}

def requireReleaseHttpsUrl(key) {
    def rawValue = providers.gradleProperty(key).orNull
    def value = rawValue?.trim()
    if (value == null || value.isEmpty()) {
        throw new GradleException("Missing required release Gradle property: " + key)
    }
    try {
        def uri = new URI(value)
        if (!uri.isAbsolute() || !"https".equalsIgnoreCase(uri.scheme) ||
                uri.host == null || uri.host.trim().isEmpty()) {
            throw new IllegalArgumentException()
        }
    } catch (Throwable error) {
        throw new GradleException(
                "Invalid release Gradle property ${key}: expected an absolute HTTPS URL with a non-empty host (got '${rawValue}')",
                error)
    }
}


def getVersionProperty(key) {
    // tailscale.version is created / updated by the makefile, it is in a loosely
    // Makfile/envfile format, which is also loosely a properties file format.
    //      make tailscale.version
    def versionProps = new Properties()
    versionProps.load(project.file('../tailscale.version').newDataInputStream())
    return versionProps.getProperty(key).replaceAll('^\"|\"$', '')
}

def isTV() {
    return project.findProperty('PLATFORM')?.toString() == 'tv'
}
